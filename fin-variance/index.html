<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget variance commentary assistant — Finance</title>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="pageTitle"></h1>
      <p class="subtitle" id="pageSubtitle"></p>
      <div class="why-box" id="whyBox">
        <div class="why-row"><span class="why-label">The problem</span><span id="whyProblem"></span></div>
        <div class="why-row"><span class="why-label">Why it helps</span><span id="whyValue"></span></div>
      </div>
      <div class="demo-banner">
        Simulated demo mode — runs entirely in your browser, no API key or server required.
        <a href="../README.md">See how this maps to a real AI implementation →</a>
      </div>
      <p class="back-link"><a href="../index.html">← All use cases</a></p>
    </div>

    <div class="grid">
      <div class="panel chat-panel">
        <div class="messages" id="messages"></div>
        <div class="suggestions" id="suggestions"></div>
        <div class="input-row">
          <input id="input" type="text" autocomplete="off" />
          <button id="sendBtn">Send</button>
        </div>
      </div>

      <div class="panel report-panel">
        <div class="report-header">
          <span class="report-title">Structured output — auto-drafted</span>
          <span id="reportBadge" class="badge">0/0 fields</span>
        </div>
        <div id="reportFields" class="report-fields"></div>
        <div class="export-row">
          <button id="exportJsonBtn" class="export-btn">Export JSON</button>
          <button id="exportCsvBtn" class="export-btn">Export CSV</button>
        </div>
        <button id="resetBtn" class="reset-btn">Reset conversation</button>
      </div>
    </div>
  </div>

  <script>window.USE_CASE_ID = "fin-variance";</script>
  <script src="../shared/helpers.js"></script>
  <script src="../shared/engine.js"></script>
  <script src="../shared/useCases.js"></script>
  <script src="../shared/single-app.js"></script>
</body>
</html>
